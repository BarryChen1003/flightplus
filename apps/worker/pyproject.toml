[tool.poetry]
name = "flightplus-worker"
version = "0.1.0"
description = "FlightPlus Python Strategy Engine"
authors = ["Shark Small"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.6" }
pydantic = "^2.9.0"
httpx = "^0.27.0"
redis = "^5.0.8"
upstash-redis = "^1.7.0"
python-dotenv = "^1.0.1"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"