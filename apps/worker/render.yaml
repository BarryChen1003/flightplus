# FlightPlus Worker — Render Blueprint
# Deploy: Connect GitHub repo → Create service → Apply blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: flightplus-worker
    env: python
    region: singapore
    plan: free          # Free tier: 512MB RAM, shared CPU
    buildCommand: cd apps/worker && pip install -r requirements.txt && pip install upstash-redis
    startCommand: cd apps/worker && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8001}
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8001
      # ── Upstash Redis（稍後在 Render Dashboard 填入）─────────────────
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # ── 可選：TP Token ───────────────────────────────────────────
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: TP_MARKER
        sync: false