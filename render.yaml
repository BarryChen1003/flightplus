# FlightPlus API — Render Blueprint
# Deploy: Connect GitHub repo → Create service → Apply blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Fastify API ────────────────────────────────────────────────────────────
  - type: web
    name: flightplus-api
    env: node
    region: singapore
    plan: free          # Free tier: 512MB RAM, shared CPU
    buildCommand: cd apps/api && npm install --include=dev && npm run build
    startCommand: cd apps/api && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # ── Upstash Redis（稍後在 Render Dashboard 填入）─────────────────
      - key: UPSTASH_REDIS_REST_URL
        sync: false   # → 在 Render Dashboard → Environment 加入
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # ── 可選：填入你的 TP Token 或同步自 GitHub ────────────────────
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: TP_MARKER
        sync: false
      # ── CORS：加入 Vercel 前端 ─────────────────────────────────
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:3001,https://flightplus-web.vercel.app,https://*.vercel.app